{% extends 'layouts/base.html' %}
{% block title %}Editar Grupo - Tienda Nueva{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto my-8 p-6 bg-white dark:bg-[#1e1e1e] text-slate-800 dark:text-slate-100 rounded-xl shadow-xl border border-slate-200 dark:border-slate-800">
    
    <!-- Encabezado -->
    <div class="border-b border-slate-200 dark:border-slate-800 pb-4 mb-6 flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold flex items-center gap-2">
                Editar Grupo: <span class="text-[#b91c1c]">{{ grupo.name }}</span>
            </h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Actualiza el nombre y los miembros asociados a este grupo.</p>
        </div>
        <a href="{% url 'grupos' %}" class="text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors">
            ✕
        </a>
    </div>

    <!-- Formulario -->
    <form method="POST" class="space-y-6">
        {% csrf_token %}

        <!-- Nombre del Grupo -->
        <div>
            <label for="nombre" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Nombre del Grupo</label>
            <input type="text" 
                    id="nombre" 
                    name="nombre" 
                    value="{{ grupo.name }}" 
                    required
                    class="w-full px-4 py-2 bg-white dark:bg-[#0f0f0f] border border-slate-300 dark:border-slate-700 rounded-lg text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-[#b91c1c] transition">
        </div>

        <!-- Botones de Acción -->
        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-800">
            <a href="{% url 'grupos' %}" 
                class="px-4 py-2 bg-slate-200 dark:bg-[#1a1a1a] hover:bg-slate-300 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg text-sm font-medium transition">
                Cancelar
            </a>
            <button type="submit" 
                    class="px-4 py-2 bg-[#b91c1c] hover:bg-[#7f1d1d] text-white rounded-lg text-sm font-medium transition shadow-sm">
                Guardar Cambios
            </button>
        </div>
    </form>
</div>
{% endblock %}
