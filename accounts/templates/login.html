<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4e6, #f8fafc);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 380px;
            background-color: white;
            padding: 40px;
            border-radius: 18px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .login-container h1 {
            text-align: center;
            color: #b91c1c;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .error {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .campo input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
        }

        .boton {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;

            background-color: #dc2626;
            color: white;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            transition: 0.3s;
        }

        .boton:hover {
            background-color: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.3);
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Iniciar sesión</h1>

        <p>Ingresa tus datos para acceder</p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="campo">
                <label>Correo electrónico:</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Ingresa tu correo electrónico"
                    required
                >
            </div>

            <div class="campo">
                <label>Contraseña:</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >
            </div>

            <button type="submit" class="boton">
                Iniciar sesión
            </button>

        </form>

    </div>

</body>
</html>
