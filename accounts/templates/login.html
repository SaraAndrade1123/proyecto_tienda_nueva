<!DOCTYPE html>
<html lang="es" class="light h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MiTienda</title>
    
    {% load static %}

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#b91c1c',
                            darkred: '#7f1d1d',
                            hoverred: '#991b1b',
                            darkbg: '#0f0f0f', 
                            darknav: '#1a1a1a', 
                            darkcard: '#1e1e1e',
                        }
                    },
                    keyframes: {
                        shine: {
                            '100%': { left: '125%' }
                        }
                    },
                    animation: {
                        'shine': 'shine 1.5s ease-in-out infinite'
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Free CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>

    <!-- Script de inicialización rápida del tema -->
    <script>
        (function () {
            try {
                const saved = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const html = document.documentElement;
                if (saved === 'dark' || (!saved && prefersDark)) {
                    html.classList.add('dark');
                    html.classList.remove('light');
                } else {
                    html.classList.remove('dark');
                    html.classList.add('light');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="h-full bg-slate-100 dark:bg-brand-darkbg text-slate-800 dark:text-slate-100 selection:bg-brand-red selection:text-white overflow-x-hidden min-h-screen relative flex items-center justify-center transition-colors duration-500">

    <!-- IMAGEN DE FONDO A PANTALLA COMPLETA -->
    <div class="fixed inset-0 w-full h-full z-0 overflow-hidden pointer-events-none">
        <div class="w-full h-full bg-cover bg-center opacity-95 transition-opacity duration-700 scale-105"
            style="background-image: url('{% get_media_prefix %}fondo_tienda.jpeg');">
        </div>
        
        <!-- Velo adaptativo -->
        <div class="absolute inset-0 bg-white/40 dark:bg-black/40 backdrop-blur-[1px] transition-colors duration-500"></div>
    </div>

    <!-- BOTÓN DE CAMBIO DE TEMA FLOTANTE -->
    <div class="fixed top-4 right-4 sm:top-6 sm:right-6 z-50">
        <button
            id="themeToggleBtn"
            onclick="toggleTheme()"
            type="button"
            class="inline-flex items-center gap-2 px-3.5 py-2 sm:px-4.5 sm:py-2.5 rounded-full text-[11px] sm:text-xs font-extrabold border border-slate-300 dark:border-white/20 bg-white/90 dark:bg-black/50 text-slate-800 dark:text-white hover:bg-white dark:hover:bg-black/70 backdrop-blur-xl shadow-2xl transition-all cursor-pointer group"
        >
            <i id="themeIcon" class="fa-solid fa-moon text-brand-red group-hover:rotate-12 transition-transform"></i>
            <span id="themeText">Modo Oscuro</span>
        </button>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="relative z-10 min-h-screen w-full flex flex-col lg:flex-row items-center justify-between p-6 pt-20 sm:p-12 sm:pt-20 lg:p-20 max-w-7xl mx-auto gap-12">
        
        <!-- COLUMNA IZQUIERDA: MENSAJE DE BIENVENIDA Y MARCA -->
        <div class="w-full lg:w-1/2 space-y-6 my-auto text-center lg:text-left">
            
            <!-- MARCA CON LOGO -->
            <div class="flex items-center justify-center lg:justify-start gap-3.5 group cursor-default">
                <div class="relative w-12 h-12 rounded-full p-0.5 bg-gradient-to-tr from-brand-red to-red-500 shadow-xl flex items-center justify-center shrink-0">
                    <div class="absolute inset-0 rounded-full bg-brand-red/40 blur-md group-hover:bg-brand-red/70 transition-all"></div>
                    <div class="w-full h-full rounded-full overflow-hidden bg-brand-darkbg flex items-center justify-center relative z-10">
                        <img src="{% get_media_prefix %}logo.png" alt="Logo" class="w-full h-full object-cover">
                    </div>
                </div>
                <span class="text-2xl sm:text-3xl font-black text-slate-900 dark:text-white tracking-tight drop-shadow-md">
                    MiTienda<span class="text-brand-red">.</span>
                </span>
            </div>

            <!-- TÍTULOS -->
            <div class="space-y-3">
                <h1 class="text-5xl sm:text-7xl font-black text-slate-900 dark:text-white tracking-tight drop-shadow-md leading-none">
                    <span class="text-brand-red">¡</span>Bienvenido<span class="text-brand-red">!</span>
                </h1>
                <p class="text-base sm:text-lg font-medium text-slate-700 dark:text-slate-100 tracking-wide drop-shadow-md max-w-md mx-auto lg:mx-0">
                    Que tengas un excelente recorrido visitando nuestra plataforma...
                </p>
            </div>

            <!-- BOTÓN VOLVER A LA TIENDA -->
            <div class="pt-2">
                <a href="{% url 'informacion_tienda' %}" class="inline-flex items-center gap-2.5 px-5 py-2.5 rounded-full bg-white/80 dark:bg-white/20 hover:bg-white backdrop-blur-xl border border-slate-300 dark:border-white/30 text-xs font-extrabold text-slate-800 dark:text-white shadow-xl hover:border-brand-red/50 transition-all active:scale-95">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                    <span>Volver a la tienda</span>
                </a>
            </div>
        </div>

        <!-- COLUMNA DERECHA: TARJETA DE LOGIN TRANSLÚCIDA OPTIMIZADA -->
        <div class="w-full lg:w-[460px] shrink-0 my-auto">
            <div class="relative w-full p-8 sm:p-10 rounded-[2rem] bg-white/80 dark:bg-brand-darkbg/55 backdrop-blur-xl border border-slate-300/80 dark:border-white/15 shadow-[0_25px_60px_rgba(0,0,0,0.2)] dark:shadow-[0_25px_60px_rgba(0,0,0,0.6)] space-y-6 transition-all duration-500">
                
                <!-- ALERTA DE ERROR DE DJANGO -->
                {% if error %}
                <div class="p-3.5 rounded-2xl bg-red-500/15 border border-brand-red/60 text-red-700 dark:text-red-200 text-xs flex items-center gap-2.5 shadow-lg">
                    <i class="fa-solid fa-circle-exclamation text-brand-red text-base shrink-0"></i>
                    <p class="font-bold leading-tight">{{ error }}</p>
                </div>
                {% endif %}

                <!-- FORMULARIO -->
                <form method="POST" action="{% url 'login' %}" class="space-y-5">
                    {% csrf_token %}

                    <!-- CAMPO USUARIO / CORREO -->
                    <div class="space-y-1.5">
                        <label for="email" class="block text-xs font-extrabold text-slate-700 dark:text-slate-200 uppercase tracking-wider pl-1">
                            Correo Electrónico
                        </label>
                        <div class="relative flex items-center">
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="ejemplo@correo.com"
                                required
                                class="w-full h-12 px-4 rounded-2xl bg-white/70 dark:bg-white/10 border border-slate-300 dark:border-white/20 text-slate-900 dark:text-white text-xs sm:text-sm font-medium placeholder:text-slate-400 focus:outline-none focus:border-brand-red focus:ring-2 focus:ring-brand-red/40 shadow-inner backdrop-blur-sm transition-all"
                            >
                        </div>
                    </div>

                    <!-- CAMPO CONTRASEÑA -->
                    <div class="space-y-1.5">
                        <label for="password" class="block text-xs font-extrabold text-slate-700 dark:text-slate-200 uppercase tracking-wider pl-1">
                            Contraseña
                        </label>
                        <div class="relative flex items-center">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                required
                                class="w-full h-12 px-4 pr-11 rounded-2xl bg-white/70 dark:bg-white/10 border border-slate-300 dark:border-white/20 text-slate-900 dark:text-white text-xs sm:text-sm font-medium placeholder:text-slate-400 focus:outline-none focus:border-brand-red focus:ring-2 focus:ring-brand-red/40 shadow-inner backdrop-blur-sm transition-all"
                            >
                            <button
                                type="button"
                                onclick="togglePasswordVisibility()"
                                class="absolute right-4 text-slate-500 dark:text-slate-300 hover:text-brand-red transition-colors focus:outline-none cursor-pointer"
                                title="Mostrar / Ocultar contraseña"
                            >
                                <i id="eyeIcon" class="fa-solid fa-eye-slash text-xs sm:text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- OPCIÓN RECORDARME -->
                    <div class="flex items-center pt-1">
                        <label class="flex items-center gap-2.5 cursor-pointer select-none group">
                            <input 
                                type="checkbox" 
                                id="remember" 
                                name="remember" 
                                class="w-4 h-4 rounded border-slate-400 dark:border-white/30 bg-white/50 dark:bg-white/10 text-brand-red focus:ring-brand-red/30 cursor-pointer"
                            >
                            <span class="text-xs font-semibold text-slate-700 dark:text-slate-200 group-hover:text-slate-900 dark:group-hover:text-white transition-colors">
                                Recordarme
                            </span>
                        </label>
                    </div>

                    <!-- BOTÓN PRINCIPAL CON EFECTO SHINE -->
                    <div class="pt-2">
                        <button
                            type="submit"
                            class="relative overflow-hidden w-full h-12 bg-gradient-to-r from-brand-red via-red-600 to-brand-hoverred hover:opacity-95 text-white font-black text-xs sm:text-sm uppercase tracking-widest rounded-2xl shadow-xl shadow-brand-red/40 active:scale-[0.99] flex items-center justify-center gap-2.5 transition-all cursor-pointer group"
                        >
                            <span class="absolute top-0 -left-full w-1/2 h-full bg-gradient-to-r from-transparent via-white/30 to-transparent skew-x-12 group-hover:animate-shine pointer-events-none"></span>
                            
                            <span>INICIAR SESIÓN</span>
                            <i class="fa-solid fa-arrow-right text-xs sm:text-sm group-hover:translate-x-1 transition-transform"></i>
                        </button>
                    </div>

                </form>

                <!-- ENLACES INFERIORES -->
                <div class="pt-4 space-y-2 text-center text-xs border-t border-slate-300/80 dark:border-white/15">
                    <p class="text-slate-700 dark:text-slate-300">
                        ¿No tienes una cuenta? 
                        <a href="{% url 'registro' %}" class="font-extrabold text-slate-900 dark:text-white hover:text-brand-red underline transition-colors ml-1">
                            Regístrate aquí
                        </a>
                    </p>
                    <div>
                        <a href="recuperar_opciones" class="font-bold text-slate-600 dark:text-slate-300 hover:text-brand-red transition-colors">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- SCRIPTS -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye text-xs sm:text-sm text-brand-red';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye-slash text-xs sm:text-sm';
            }
        }

        function updateThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');

            if (isDark) {
                icon.className = 'fa-solid fa-sun text-yellow-400';
                text.textContent = 'Modo Claro';
            } else {
                icon.className = 'fa-solid fa-moon text-brand-red';
                text.textContent = 'Modo Oscuro';
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeUI();
        }

        document.addEventListener('DOMContentLoaded', updateThemeUI);
    </script>

</body>
</html>
