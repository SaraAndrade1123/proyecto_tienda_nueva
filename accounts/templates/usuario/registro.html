<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Free CDN (6.5.1) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md my-8">
        <!-- Encabezado -->
        <div class="text-center mb-6">
            <div class="inline-block p-3 bg-indigo-50 text-indigo-600 rounded-full mb-2">
                <i class="fa-solid fa-user-plus fa-2x"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Crear Cuenta</h2>
            <p class="text-sm text-gray-500">Completa tus datos para registrarte</p>
        </div>

        <!-- Alerta de Errores -->
        {% if errors %}
            <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-md">
                <div class="flex items-center mb-1">
                    <i class="fa-solid fa-triangle-exclamation text-red-500 mr-2"></i>
                    <h3 class="text-sm font-semibold text-red-800">Se encontraron errores:</h3>
                </div>
                <ul class="list-disc pl-5 text-sm text-red-700 space-y-1">
                    {% for error in errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <form action="" method="POST" class="space-y-4">
            {% csrf_token %}

            <!-- Usuario -->
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nombre de Usuario</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-at"></i>
                    </span>
                    <input type="text" id="username" name="username" value="{{ datos.username|default:'' }}" required
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                        placeholder="usuario123">
                </div>
            </div>

            <!-- Nombre y Apellido (2 columnas) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="first_name" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="first_name" name="first_name" value="{{ datos.first_name|default:'' }}" required
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                            placeholder="Carlos">
                    </div>
                </div>

                <div>
                    <label for="last_name" class="block text-sm font-medium text-gray-700 mb-1">Apellido</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="last_name" name="last_name" value="{{ datos.last_name|default:'' }}" required
                            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                            placeholder="Pérez">
                    </div>
                </div>
            </div>

            <!-- Documento -->
            <div>
                <label for="document" class="block text-sm font-medium text-gray-700 mb-1">Documento de Identidad</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-id-card"></i>
                    </span>
                    <input type="text" id="document" name="document" value="{{ datos.document|default:'' }}" required
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                        placeholder="123456789">
                </div>
            </div>

            <!-- Teléfono -->
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-phone"></i>
                    </span>
                    <input type="text" id="phone" name="phone" value="{{ datos.phone|default:'' }}" required
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                        placeholder="+57 300 000 0000">
                </div>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input type="email" id="email" name="email" value="{{ datos.email|default:'' }}" required
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                        placeholder="correo@ejemplo.com">
                </div>
            </div>

            <!-- Contraseña -->
            <div>
                <label for="password1" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password1" name="password1" required
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                        placeholder="••••••••">
                </div>
            </div>

            <!-- Confirmar Contraseña -->
            <div>
                <label for="password2" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fa-solid fa-shield-halved"></i>
                    </span>
                    <input type="password" id="password2" name="password2" required
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                        placeholder="••••••••">
                </div>
            </div>

            <!-- Botón Submit -->
            <button type="submit"
                class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition duration-200 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-user-check"></i>
                <span>Registrar Cuenta</span>
            </button>
        </form>
    </div>

</body>
</html>
