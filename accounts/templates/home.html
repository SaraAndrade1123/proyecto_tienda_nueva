<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 640'><path fill='rgb(185, 28, 28)' d='M94.7 136.3C101.6 112.4 123.5 96 148.4 96L492.4 96C517.3 96 539.2 112.4 546.2 136.3L569.6 216.5C582.4 260.2 549.5 304 504 304C477.7 304 454.6 289.1 443.2 266.9C431.6 288.8 408.6 304 381.8 304C355.2 304 332.1 289 320.5 267C308.9 289 285.8 304 259.2 304C232.4 304 209.4 288.9 197.8 266.9C186.4 289 163.3 304 137 304C91.4 304 58.6 260.3 71.4 216.5L94.7 136.3zM160.4 416L480.4 416L480.4 349.6C488 351.2 495.9 352 503.9 352C518.2 352 531.9 349.4 544.4 344.8L544.4 496C544.4 522.5 522.9 544 496.4 544L144.4 544C117.9 544 96.4 522.5 96.4 496L96.4 344.8C108.9 349.4 122.5 352 136.9 352C145 352 152.8 351.2 160.4 349.6L160.4 416z'/></svg>">

    <title>Inicio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff1f2;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            background: white;
            padding: 40px;
            border-radius: 18px;
            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #b91c1c;
        }

        p {
            color: #64748b;
            margin-bottom: 25px;
        }

        .boton {
            display: inline-block;
            padding: 12px 25px;

            background-color: #dc2626;
            color: white;

            text-decoration: none;
            border-radius: 10px;

            font-weight: bold;
        }

        .boton:hover {
            background-color: #b91c1c;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>¡Bienvenido!</h1>

        <p>Has iniciado sesión correctamente.</p>
        
        <a href="/" class="boton">
            Ver catálogo
        </a>

        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}

            <button type="submit" class="boton">
                Cerrar sesión
            </button>
        </form>

    </div>

</body>
</html>
